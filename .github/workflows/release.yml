# Publish to PyPI when a v* tag is pushed.
# One-time trusted-publisher setup is documented in the README under Publishing.
# This workflow stores no PyPI token. Do not add one.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Fails the release before anything is built or published unless CI on the
  # tagged commit is green and LICENSE and README.md exist and are not empty.
  # Shared with the Devvit releases: AllHailSeizure/.github release-gates.yml.
  gates:
    name: Release gates
    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read
    uses: AllHailSeizure/.github/.github/workflows/release-gates.yml@master

  build:
    name: Build release
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Require the tag to match pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${version}." >&2
            echo "Bump version, then push an annotated or lightweight tag named v\${version}." >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the wheel away from the repository
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          /tmp/wheel-venv/bin/sidereel-cli --help
          /tmp/wheel-venv/bin/sidereel-cli --output "$RUNNER_TEMP/sidereel.png"
          test -x /tmp/wheel-venv/bin/sidereel
          test -s "$RUNNER_TEMP/sidereel.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [gates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sidereel/
    permissions:
      actions: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
