name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python sources and tests
        run: python -m ruff check . --output-format github

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        # Qt links these libraries even with QT_QPA_PLATFORM=offscreen.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run complete test suite
        run: python -m pytest -q

  wheel:
    name: Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
          test -n "$(ls dist/*.tar.gz)"
          test -n "$(ls dist/*.whl)"
      - name: Confirm catalog data is inside the wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile
          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          assert "simulations/star_system/catalog-sources.json" in names, names
          entry = next(name for name in names if name.endswith(".dist-info/entry_points.txt"))
          text = zipfile.ZipFile(wheels[0]).read(entry).decode()
          assert "[gui_scripts]" in text and "star-system = simulations.star_system.desktop:main" in text
          assert "star-system-cli = simulations.star_system.__main__:main" in text
          PY
      - name: Install the wheel into a clean virtual environment
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install dist/*.whl
      - name: Smoke-test the installed CLI away from the repository
        env:
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: |
          cd "$RUNNER_TEMP"
          /tmp/wheel-venv/bin/star-system-cli --help
          /tmp/wheel-venv/bin/star-system-cli --star sun --planet earth --output "$RUNNER_TEMP/star-system.png"
          test -x /tmp/wheel-venv/bin/star-system
          /tmp/wheel-venv/bin/python - <<'PY'
          import importlib.metadata as metadata
          import os
          from importlib.resources import files
          from pathlib import Path
          gui = {ep.name: ep.value for ep in metadata.entry_points(group="gui_scripts")}
          cli = {ep.name: ep.value for ep in metadata.entry_points(group="console_scripts")}
          assert gui["star-system"] == "simulations.star_system.desktop:main"
          assert "star-system" not in cli
          assert cli["star-system-cli"] == "simulations.star_system.__main__:main"
          text = files("simulations.star_system").joinpath("catalog-sources.json").read_text(encoding="utf-8")
          assert '"sun"' in text
          from simulations.star_system.data import CATALOG
          assert CATALOG["sun"].name == "Sun"
          image = Path(os.environ["RUNNER_TEMP"]) / "star-system.png"
          data = image.read_bytes()
          assert data.startswith(b"\x89PNG") and len(data) > 1000
          PY
