# Monthly version updates for pip and GitHub Actions.
# Pip updates are grouped into a single PR. Dependabot PRs are labelled tooling.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "tooling"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "tooling"
