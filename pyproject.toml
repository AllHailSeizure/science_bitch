[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "star-system"
version = "0.1.0"
description = "Interactive N-body star-system sandbox with a Qt Observatory desktop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Nate Bosma"}]
keywords = ["n-body", "astronomy", "simulation", "pyqt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.8",
    "pillow>=10",
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff==0.17.3",
]

[project.urls]
Homepage = "https://github.com/AllHailSeizure/star-system"
Repository = "https://github.com/AllHailSeizure/star-system"
Issues = "https://github.com/AllHailSeizure/star-system/issues"

# star-system is a GUI script so Windows launches it with pythonw (no console).
# star-system-cli keeps the full command line, including headless --output.
[project.gui-scripts]
star-system = "simulations.star_system.desktop:main"

[project.scripts]
star-system-cli = "simulations.star_system.__main__:main"

[tool.setuptools.packages.find]
include = ["simulations*"]

[tool.setuptools.package-data]
"simulations.star_system" = ["catalog-sources.json"]
